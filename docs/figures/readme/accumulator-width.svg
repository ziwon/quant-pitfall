<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">Accumulator width changes classification accuracy</title>
  <desc id="desc">Recorded CIFAR-10 MobileNetV2 evaluation on 10,000 test images,
    using the same seed-0 W4A8 checkpoint and saturating accumulation.
    Top-1 accuracy: 32-bit 92.18%; 16-bit 65.59%.
    Both bars start at zero and use the same 0–100% scale.</desc>

  <!-- Source: docs/results/m4.json.gz, full.32-saturate and full.16-saturate.
       Bar width = 1072 * top1 / 100. These are archived measurements. -->
  <rect width="1200" height="520" rx="12" fill="#f7f9f8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="experiment-title" fill="#18282f">
      <text x="64" y="64" font-size="24" fill="#56666d"
            letter-spacing="2">09 / INTEGER INFERENCE</text>
      <text x="64" y="132" font-size="52" font-weight="650">Accumulator width matters</text>
    </g>

    <g id="accuracy-32-bit">
      <text x="64" y="228" font-size="48" font-weight="600" fill="#18282f">32-bit</text>
      <text x="1136" y="232" text-anchor="end" font-size="68"
            font-weight="650" fill="#147d78">92.18%</text>
      <rect x="64" y="256" width="1072" height="16" fill="#e0e6e4"/>
      <rect x="64" y="256" width="988.1696" height="16" fill="#147d78"/>
    </g>

    <g id="accuracy-16-bit">
      <text x="64" y="356" font-size="48" font-weight="600" fill="#18282f">16-bit</text>
      <text x="1136" y="360" text-anchor="end" font-size="68"
            font-weight="650" fill="#b05534">65.59%</text>
      <rect x="64" y="384" width="1072" height="16" fill="#e0e6e4"/>
      <rect x="64" y="384" width="703.1248" height="16" fill="#b05534"/>
    </g>

    <g id="measurement-context" font-size="24" fill="#56666d">
      <text x="64" y="458">CIFAR-10 · MobileNetV2 · seed 0 · 10,000 test images</text>
      <text x="64" y="492">Saturating accumulation · top-1 accuracy · bars span 0–100%</text>
    </g>
  </g>
</svg>
