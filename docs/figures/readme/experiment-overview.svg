    <text x="56" y="312" font-size="24" font-weight="400" fill="#18282f" text-anchor="start">4σ / optimal α = 2.474σ</text>
    <text x="56" y="368" font-size="22" font-weight="400" fill="#56666d" text-anchor="start">Gaussian · W4 narrow range</text>
    <text x="56" y="402" font-size="22" font-weight="400" fill="#56666d" text-anchor="start">Numerical integration</text>
    <text x="436" y="194" font-size="28" font-weight="650" fill="#18282f" text-anchor="start">02  Rounding</text>
    <text x="436" y="266" font-size="48" font-weight="600" fill="#b05534" text-anchor="start">3.998× MSE</text>
