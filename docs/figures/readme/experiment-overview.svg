<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Nine quantization experiments: measured findings</title>
  <desc id="desc">01: fixed 4-sigma clipping has 2.111 times optimal MSE. 02: floor has about four times nearest MSE without clipping. 03: APoT wins or loses depending on the input distribution. 04: raw per-tensor quantization loses accuracy after BN folding. 05: observing from the start and warmup both recover high accuracy. 06: FP16 storage suppresses small SGD weight updates. 07: BN-freeze timing has a modest measured effect at batch 128. 08: MSE-clipped PTQ has lower top-1 than min/max in these runs. 09: saturating int8 accumulation depends on term order. See the adjacent Markdown for all values and experimental conditions.</desc>
