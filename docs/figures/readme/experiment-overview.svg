    <text x="436" y="368" font-size="24" font-weight="400" fill="#18282f" text-anchor="start">3.448× at optimal clips</text>
    <text x="436" y="402" font-size="22" font-weight="400" fill="#56666d" text-anchor="start">Synthetic input · seed 0</text>
